openapi: 3.1.0
info:
  title: E-Commerce XP API
  version: 1.0.0
  description: API para gestionar el catálogo y procesar pedidos de forma transaccional.
servers:
  - url: http://localhost:3000
    description: Entorno local
tags:
  - name: Pedidos
    description: Checkout y gestión de pedidos
  - name: Sesiones
    description: HU07 - listado y revocación de sesiones activas
paths:
  /api/auth/login:
    post:
      tags: [Sesiones]
      summary: Iniciar una sesión identificando el dispositivo
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
  /api/auth/sessions:
    get:
      tags: [Sesiones]
      summary: Listar las sesiones activas propias
      operationId: listarSesiones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesiones activas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SesionActiva'
        '403':
          description: JWT inválido o sesión revocada
  /api/auth/sessions/{sessionId}:
    delete:
      tags: [Sesiones]
      summary: Revocar una sesión propia
      operationId: revocarSesion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Sesión revocada
        '403':
          description: La sesión pertenece a otro usuario
        '404':
          description: Sesión inexistente
  /api/pedidos:
    post:
      tags: [Pedidos]
      summary: Procesar un pedido
      description: Crea el pedido, descuenta el stock y registra sus detalles en una única transacción.
      operationId: crearPedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPedidoDto'
            examples:
              variosProductos:
                summary: Pedido con varios productos
                value:
                  clienteId: cliente_01
                  items:
                    - producto: Placa de Video
                      cantidad: 2
                    - producto: Teclado Mecánico
                      cantidad: 1
      responses:
        '201':
          description: Pedido creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          description: El cliente indicado no está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Algún producto no existe o no tiene stock suficiente; la operación completa se revierte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: El cuerpo de la petición es inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@estudio.local
        password:
          type: string
          format: password
          example: Admin#12345
        totp:
          type: string
          example: '123456'
        deviceName:
          type: string
          example: Notebook personal
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, sessionId, clienteId, rol]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        sessionId:
          type: string
          format: uuid
        clienteId:
          type: string
        rol:
          type: string
          enum: [CLIENTE, ADMIN]
    SesionActiva:
      type: object
      required: [sessionId, deviceName, createdAt, lastUsedAt, expiresAt, current]
      properties:
        sessionId:
          type: string
          format: uuid
        deviceName:
          type: string
        userAgent:
          type: [string, 'null']
        ipAddress:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    CrearPedidoDto:
      type: object
      required: [clienteId, items]
      properties:
        clienteId:
          type: string
          minLength: 1
          example: cliente_01
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CrearPedidoItemDto'
    CrearPedidoItemDto:
      type: object
      required: [producto, cantidad]
      properties:
        producto:
          type: string
          minLength: 1
          example: Placa de Video
        cantidad:
          type: integer
          minimum: 1
          example: 2
    Pedido:
      type: object
      required: [id, clienteId, estado, items, total, createdAt]
      properties:
        id:
          type: integer
          example: 1
        clienteId:
          type: string
          example: cliente_01
        estado:
          type: string
          example: Pendiente de Envío
        stockRestante:
          type: integer
          example: 3
        items:
          type: array
          items:
            $ref: '#/components/schemas/PedidoItem'
        total:
          type: number
          format: double
          example: 250000
        createdAt:
          type: string
          format: date-time
    PedidoItem:
      type: object
      required: [producto, cantidad, precioUnitario]
      properties:
        producto:
          type: string
        cantidad:
          type: integer
        precioUnitario:
          type: number
          format: double
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
