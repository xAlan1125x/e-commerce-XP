name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_xp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_xp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Secretos exclusivos de CI (no productivos): JWT_SECRET/JWT_REFRESH_SECRET son
      # obligatorios para firmar tokens y no tienen valor por defecto en el código.
      JWT_SECRET: ci-only-access-secret-do-not-use-in-prod
      JWT_REFRESH_SECRET: ci-only-refresh-secret-do-not-use-in-prod
      ENCRYPTION_KEY: ci-only-encryption-key-do-not-use-in-prod
      DEV_TOTP_CODE: '123456'
      SEED_ADMIN_EMAIL: admin@estudio.local
      SEED_ADMIN_PASSWORD: "Admin#12345"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_xp_test?schema=public

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de Linter
        run: npm run lint --if-present

      - name: Compilación de TypeScript
        run: npx tsc --noEmit

      - name: Preparar base de datos de pruebas
        run: npm run db:deploy

      - name: Ejecución de Pruebas BDD (Cucumber)
        run: npm run test:e2e
