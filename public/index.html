<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Commerce XP</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="hero">
      <div class="container">
        <p class="eyebrow">Backend + BDD + XP</p>
        <h1>Catálogo E-Commerce</h1>
        <p class="subtitle">Administra productos, stock y pedidos desde una interfaz simple.</p>
      </div>
    </header>

    <main class="container layout">
      <section class="panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Catálogo</p>
            <h2>Productos disponibles</h2>
          </div>
          <button id="refresh-products" class="button secondary" type="button">Actualizar</button>
        </div>
        <form id="filter-form" class="inline-form">
          <label>
            Categoría
            <input id="category-filter" name="categoria" placeholder="Ej. Audio">
          </label>
          <button class="button" type="submit">Filtrar</button>
        </form>
        <div id="product-list" class="product-grid" aria-live="polite"></div>
      </section>

      <aside class="panel">
        <p class="eyebrow">Administración</p>
        <h2>Nuevo producto</h2>
        <form id="product-form" class="stack-form">
          <label>Nombre<input name="nombre" required></label>
          <label>Precio<input name="precio" type="number" min="0.01" step="0.01" required></label>
          <label>Stock<input name="stock" type="number" min="0" step="1" required></label>
          <label>Categoría<input name="categoria" required></label>
          <button class="button" type="submit">Crear producto</button>
        </form>
        <p id="notice" class="notice" role="status"></p>
      </aside>

      <section class="panel orders-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Checkout</p>
            <h2>Crear pedido</h2>
          </div>
        </div>
        <form id="order-form" class="order-form">
          <label>Cliente<input name="clienteId" value="cliente_web" required></label>
          <label>Producto<select id="order-product" name="producto" required></select></label>
          <label>Cantidad<input name="cantidad" type="number" min="1" step="1" value="1" required></label>
          <button class="button" type="submit">Confirmar pedido</button>
        </form>
        <div id="order-result" class="notice" role="status"></div>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
